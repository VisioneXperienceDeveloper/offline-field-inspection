<section class="photo-section" id="photo-section">
  <header><div><h2>Photo evidence</h2><p>{{ metadataEnabled() ? 'Capture time and filename are stored.' : 'Photo metadata storage is disabled.' }} Device location is not collected or requested.</p></div><span>{{ photos().length }} photos</span></header>
  <div class="photos">
    @for (photo of photos(); track photo.id) { <figure>@if(photo.source){<img [src]="photo.source" [alt]="photo.name">}@else{<div class="preview-unavailable" role="img" [attr.aria-label]="photo.name + ' preview unavailable on this device'"><span>▣</span><small>Preview unavailable on this device</small></div>}<button type="button" [disabled]="disabled()" [attr.aria-label]="'Remove ' + photo.name" (click)="photoRemoved.emit(photo.id)">×</button><figcaption><strong>{{ photo.name }}</strong><span>{{ metadataEnabled() ? photo.capturedAt + ' · ' : '' }}Location not collected by Fieldnote</span></figcaption></figure> }
    <label class="upload" [class.disabled]="disabled() || processing()"><input type="file" accept="image/jpeg,image/png,image/webp" capture="environment" [disabled]="disabled() || processing()" (change)="selectPhoto($event)"><span aria-hidden="true">▣</span><strong>{{ processing() ? 'Compressing photo…' : 'Add photo' }}</strong><small>JPEG, PNG or WebP · maximum 10 MB</small></label>
  </div>
  @if (errorMessage()) { <p class="photo-error" role="alert">{{ errorMessage() }}</p> }
</section>
