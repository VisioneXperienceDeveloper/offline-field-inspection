name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npm run e2e
      - run: npm run artifact:checksum
      - run: npm run artifact:verify
      - run: npm run artifact:server:checksum
      - run: npm run artifact:server:verify
      - uses: actions/upload-artifact@v4
        with:
          name: fieldnote-${{ github.sha }}
          path: |
            dist/fieldnote
            dist/fieldnote-server
          if-no-files-found: error
          retention-days: 14
